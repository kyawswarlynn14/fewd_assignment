<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="container">
    <div id="navbar" class="nav-bar"></div>

    <section id="subscription" class="subscription">
        <div class="subscription-box1">
            <img class="subscription-img" src="../images/subscription.webp" alt="subscription">
        </div>

        <div class="subscription-box2">
            <div class="subscription-container">
                <h1 class="subscription-title">Subscribe!</h1>
                <p class="subscription-description">
                    Join our community and be the first to know about our latest coffee blends, exclusive offers, and special events. Subscribe today and enjoy a premium coffee experience like never before.
                </p>
    
                <input class="subscription-input" type="text" placeholder="Enter your name">
                <input  class="subscription-input" type="text" placeholder="Enter your email">
                <button class="subscription-btn">
                    Send
                </button>
            </div>
        </div>
    </section>

    <div id="footer"></div>

    <script src="/script.js"></script>

    <script src="https://kit.fontawesome.com/1c7346f4a7.js" crossorigin="anonymous"></script>
</body>
</html>
