<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Bean Boutique - Cart</title>
    <link rel="icon" href="../images/logo.png">
		<link rel="stylesheet" href="../css/styles.css" />
	</head>
	<body class="container">
        <nav id="navbar" class="nav-bar">
            <img class="logo" src="../images/logo.png" alt="logo" >
            <div class="nav-btn-gp">
                <a href="../index.html" class="nav-btn">Home</a>
                <a href="./about.html" class="nav-btn">About</a>
                <a href="./special.html" class="nav-btn">Coffee</a>
                <a href="./menu.html" class="nav-btn">Menu</a>
                <a href="./subscription.html" class="nav-btn">Subscribe</a>
            </div>
            <a href="./cart.html" class="cart-btn">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="badge">3</span>
            </a>
    
            <button class="hamburger" id="hamburger">
                <i class="fa fa-bars"></i>
            </button>
        </nav>

        <section id="cart" class="cart">
            <div class="cart-container">
                <div class="item">
                    <div class="cart-item">
                        <img
                            src="../images/cappuccino.jpg"
                            alt="cappuccino"
                            class="cart-img"
                        >
                        <div class="cart-box">
                            <h3>Cappuccino</h3>
                            <p>2</p>
                            <p>Price: $11.5</p>
                        </div>
                    </div>
    
                    <p>
                        $23.0
                    </p>
                </div>
    
                <div class="item">
                    <div class="cart-item">
                        <img
                            src="../images/mocha.jpg"
                            alt="Mocha"
                            class="cart-img"
                        >
                        <div class="cart-box">
                            <h3>Mocha</h3>
                            <p>1</p>
                            <p>Price: $12.0</p>
                        </div>
                    </div>
    
                    <p>
                        $12.0
                    </p>
                </div>
    
                <div class="item">
                    <div class="cart-item">
                        <img
                            src="../images/coldbrew.jpg"
                            alt="Cold Brew"
                            class="cart-img"
                        >
                        <div class="cart-box">
                            <h3>Cold Brew</h3>
                            <p>3</p>
                            <p>Price: $10.0</p>
                        </div>
                    </div>
    
                    <p>
                        $30.0
                    </p>
                </div>
            </div>
    
            <h2 class="total-price">Total: $65.0</h2>
    
            <button class="home-btn proceed-btn">
                Proceed to Payment
            </button>
        </section>

        <section class="footer">
            <div class="footer-box1">
                <h1 class="footer-title">COME ON IN!</h1>
    
                <div>
                    <h3 class="footer-subtitle">WEEKDAYS</h3>
                    <p class="footer-description">08AM-10PM</p>
                </div>
    
                <div>
                    <h3 class="footer-subtitle">WEEKENDS</h3>
                    <p class="footer-description">10AM-11PM</p>
                </div>

                <h1 class="footer-title">Social Accounts</h1>
    
                <div class="social-btn-box">
                    <a href="https://www.facebook.com/Dutch.Colony.Coffee" class="social-btn">
                        <i class="fa-brands fa-square-facebook"></i>
                    </a>
    
                    <a href="https://twitter.com/thecoffeebean" class="social-btn">
                        <i class="fa-brands fa-square-twitter"></i>
                    </a>
    
                    <a href="https://www.instagram.com/rookies.coffee" class="social-btn">
                        <i class="fa-brands fa-square-instagram"></i>
                    </a>
                </div>
            </div>
    
            <div class="footer-box2">
                <h1 class="footer-title">CONTACT</h1>
    
                <div>
                    <h3 class="footer-subtitle">PHONE</h3>
                    <p class="footer-description">09123456789</p>
                </div>
    
                <div>
                    <h3 class="footer-subtitle">MAIL</h3>
                    <p class="footer-description">ksl@gmail.com</p>
                </div>
    
                <div>
                    <h3 class="footer-subtitle">ADDRESS</h3>
                    <p class="footer-description">Mandalay</p>
                </div>
            </div>
        </section>

        <script src="../script/script.js"></script>
        <script
			src="https://kit.fontawesome.com/1c7346f4a7.js"
			crossorigin="anonymous"
		></script>
	</body>
</html>
