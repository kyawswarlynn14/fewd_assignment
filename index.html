<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bean Boutique</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="container">
    <div id="navbar" class="nav-bar"></div>

    <section id="home" class="home">
        <div class="home-left">
            <h1 class="header">Bean Boutique</h1>

            <p class="description">
                Bean Boutique is a cozy coffee shop that serves high-quality, freshly brewed coffee made from ethically sourced beans. Whether you’re in the mood for a rich espresso or a smooth latte, we offer a welcoming space to relax and enjoy your favorite drink.
            </p>

            <div class="home-btn-gp">
                <button class="home-btn order-btn">Order Now</button>
                <button class="home-btn about-btn" onclick="window.location.href='/pages/about.html'">About Shop</button>
            </div>
        </div>

        <div class="home-right">
            <img class="home-right-img" src="./images/home.png" alt="coffee">
        </div>
    </section>

    <div id="footer"></div>

    <script src="/script.js"></script>
    <script src="https://kit.fontawesome.com/1c7346f4a7.js" crossorigin="anonymous"></script>
</body>
</html>
